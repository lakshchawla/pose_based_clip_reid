# Stage 1: per-branch CLIP prompt learning, with relational mixing across a person's M=1+K
# branches (global/foreground + K parts, uniformly) on both sides -- TextualAttentionBlock (owned
# by PromptLearner) on the text side, VisualAttentionBlock on the image side.
#
# Image side (build_encoder() in examples/train_relational_prompts.py): ClipRN50BPAMEncoder --
# BPAM's own PixelToPartClassifier sitting directly on CLIP's own frozen RN50 (layer4's stride
# dropped to 1 + AttentionPool2d re-invoked over every location instead of just the mean-pooled
# token, both using pretrained weights unchanged -- see pcr/models/clip_dense_part_encoder.py).
# No BPBreID/HRNet anywhere in this stage anymore: the image and text sides now share CLIP's own
# pretrained joint embedding space instead of two independently-trained spaces that only happened
# to match in dimension. CLIP's text encoder is frozen too; only ctx (incl.
# TextualAttentionBlock) and VisualAttentionBlock train -- see
# examples/train_relational_prompts.py's own docstring for the full Algorithm 1 this file's
# script now follows exactly. Run examples/cache_text_anchors.py against this same config
# afterward to build Stage 2's frozen text-prototype table.
#
# Known limitation, not yet relevant to this stage: ClipTextEncoder.encode_branch_self_attention
# (CAB's Stage 2 precompute step) asserts embed_dim == transformer_width, which holds for
# ViT-B/16 (both 512) but NOT RN50 (1024 vs 512) -- CAB will need a different precompute path
# before Stage 2 can use this same clip.arch.
#
# No visibility: section -- the upstream image-level filter this used to configure was removed
# (see progress.md's entry on this); every image is used, weighted per-part inside SupConLoss
# instead.

model:
  # Algorithm 1's own initialization step: load Stage 0's converged checkpoint, not ImageNet
  # init -- run examples/train_bpa_segmentation_rn50.py first
  # (configs/stage0_bpa_segmentation_rn50.yaml) to produce this file. Must be a checkpoint trained
  # at the same clip.arch as below -- PixelToPartClassifier's conv is shape-locked to that arch's
  # backbone width (2048 for RN50, the channel count feeding AttentionPool2d).
  checkpoint_path: 'examples/logs/stage0_bpa_rn50/model_best.pth.tar'
  parts_num: 5                # K body parts; num_branches = 1 (foreground) + parts_num

clip:
  arch: RN50                    # drives BOTH clip_txt_encoder and the image side's
                                 # ClipRN50BPAMEncoder (see build_encoder()) -- one field, so the
                                 # two towers can never end up mismatched. 1024-dim embed_dim (the
                                 # dimension SupCon actually compares on); transformer_width is
                                 # 512 (the text transformer's own internal width, unrelated to
                                 # this) -- see pcr/models/clip_text_encoder.py's own docstring on
                                 # why these two numbers differ for RN50 specifically. Reusing the
                                 # exact arch the Stage 0 checkpoint above was trained on is
                                 # required -- CLIP's image/text towers only share a real
                                 # pretrained joint space when both come from the same
                                 # clip.load(arch) call.
  n_ctx: 4                     # back to 4 -- n_ctx=8 measured equal-or-slightly-worse earlier
                                # this session (likely overfitting; 4 was already enough to
                                # capture each part distinctly)

tab:
  num_heads: 4                 # TextualAttentionBlock's attention heads, over all M=1+K branches
  num_layers: 1                # start shallow -- see progress.md for the ablation this should feed

vab:
  num_heads: 4                 # VisualAttentionBlock's attention heads, over all M=1+K branches
  num_layers: 1                # start shallow -- see progress.md for the ablation this should feed

relalign:
  # L_relalign: pulls VAB's branch-to-branch attention pattern toward TAB's (detached), guarding
  # against both blocks converging to degenerate near-identical patterns across branches. Same
  # warmup/ramp/flat schedule shape as Stage 2's crossalign -- see METHODOLOGY.md.
  warmup_fraction: 0.3
  ramp_fraction: 0.2
  lambda_max: 0.3

data:
  dataset: market1501         # or dukemtmc-reid
  data_dir: ../datasets
  height: 384
  width: 128
  batch_size: 32               # PK batch size per SupCon training step (must be a multiple of num_instances)
  num_instances: 4             # PK sampling over the cached feature set: batch_size // num_instances
                                # identities per batch, num_instances cached images each (with
                                # replacement if an identity has fewer) -- Algorithm 1 step 6
  cache_batch_size: 32        # batch size for the one-off full-dataset feature-caching pass
  workers: 4

optim:
  # PyYAML (YAML 1.1) requires a decimal point in the mantissa for scientific notation to parse
  # as a float -- confirmed directly: yaml.safe_load('1e-4') -> the string '1e-4', not a float,
  # which would crash torch.optim.Adam(weight_decay=...). Plain decimal notation always parses
  # correctly, so small values below are written that way rather than as scientific notation.
  lr: 0.00035
  weight_decay: 0.0001
  epochs: 120
  warmup_epochs: 5
  warmup_lr_init: 0.00001
  lr_min: 0.000001

loss:
  # Initial value only -- SupConLoss's temperature is learnable (see that file's own docstring)
  # and logged every epoch. 0.1, not SupConLoss's own original 1.0 (CLIP-ReID's value, tuned for
  # comparing against one small batch's worth of identities): this loss compares against the full
  # training set (751 identities / 12936 images) every step, and needs a sharper starting
  # temperature to give a useful gradient at that scale from the first step onward.
  temperature: 0.1

logging:
  logs_dir: examples/logs/stage1_prompts_clipvit   # separate from the old BPBreID-backbone run's dir
  print_freq: 10
  seed: 1
