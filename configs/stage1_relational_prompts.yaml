# Stage 1: per-branch CLIP prompt learning, with relational mixing across a person's M=1+K
# branches (global/foreground + K parts, uniformly) on both sides -- TextualAttentionBlock (owned
# by PromptLearner) on the text side, VisualAttentionBlock on the image side. BPBreID backbone,
# the CLIP text encoder, and the CLIP image encoder are all frozen; only ctx (incl.
# TextualAttentionBlock) and VisualAttentionBlock train -- see
# examples/train_relational_prompts.py's own docstring for the full Algorithm 1 this file's
# script now follows exactly. Run examples/cache_text_anchors.py against this same config
# afterward to build Stage 2's frozen text-prototype table.
#
# Renamed from stage1_prompt_learning.yaml -- pairs with the renamed script; the tab:/vab:
# sections below are the new content relative to that file. No visibility: section -- the
# upstream image-level filter this used to configure was removed (see progress.md's entry on
# this); every image is used, weighted per-part inside SupConLoss instead.

model:
  backbone: hrnet32          # or resnet50 -- must match Stage 0's own backbone
  # Algorithm 1's own initialization step: load Stage 0's converged checkpoint, not ImageNet
  # init -- run examples/train_bpa_segmentation.py first (configs/stage0_bpa_segmentation.yaml)
  # to produce this file.
  checkpoint_path: 'examples/logs/stage0_bpa/model_best.pth.tar'
  dim_reduce_output: 512     # must equal clip.arch's text embed dim (512 for ViT-B/32 and ViT-B/16)
  parts_num: 5                # K body parts; num_branches = 1 (foreground) + parts_num

clip:
  arch: ViT-B/16               # 512-dim text embedding, matching model.dim_reduce_output above --
                                # see pcr/models/clip_text_encoder.py's own docstring for other archs' sizes
  n_ctx: 4                    # learnable context tokens per (identity, branch)

tab:
  num_heads: 4                 # TextualAttentionBlock's attention heads, over all M=1+K branches
  num_layers: 1                # start shallow -- see progress.md for the ablation this should feed

vab:
  num_heads: 4                 # VisualAttentionBlock's attention heads, over all M=1+K branches
  num_layers: 1                # start shallow -- see progress.md for the ablation this should feed

relalign:
  # L_relalign: pulls VAB's branch-to-branch attention pattern toward TAB's (detached), guarding
  # against both blocks converging to degenerate near-identical patterns across branches. Same
  # warmup/ramp/flat schedule shape as Stage 2's crossalign -- see METHODOLOGY.md.
  warmup_fraction: 0.3
  ramp_fraction: 0.2
  lambda_max: 0.3

data:
  dataset: market1501         # or dukemtmc-reid
  data_dir: ../datasets
  height: 384
  width: 128
  batch_size: 32               # PK batch size per SupCon training step (must be a multiple of num_instances)
  num_instances: 4             # PK sampling over the cached feature set: batch_size // num_instances
                                # identities per batch, num_instances cached images each (with
                                # replacement if an identity has fewer) -- Algorithm 1 step 6
  cache_batch_size: 32        # batch size for the one-off full-dataset feature-caching pass
  workers: 4

optim:
  # PyYAML (YAML 1.1) requires a decimal point in the mantissa for scientific notation to parse
  # as a float -- confirmed directly: yaml.safe_load('1e-4') -> the string '1e-4', not a float,
  # which would crash torch.optim.Adam(weight_decay=...). Plain decimal notation always parses
  # correctly, so small values below are written that way rather than as scientific notation.
  lr: 0.00035
  weight_decay: 0.0001
  epochs: 120
  warmup_epochs: 5
  warmup_lr_init: 0.00001
  lr_min: 0.000001

loss:
  # Initial value only -- SupConLoss's temperature is learnable (see that file's own docstring)
  # and logged every epoch. 0.1, not SupConLoss's own original 1.0 (CLIP-ReID's value, tuned for
  # comparing against one small batch's worth of identities): this loss compares against the full
  # training set (751 identities / 12936 images) every step, and needs a sharper starting
  # temperature to give a useful gradient at that scale from the first step onward.
  temperature: 0.1

logging:
  logs_dir: examples/logs/stage1_prompts
  print_freq: 10
  seed: 1
